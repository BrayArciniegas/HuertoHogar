<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Admin HuertoHogar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script>
        if (sessionStorage.getItem("adminAutenticado") !== "true") {
            window.location.href = "login.html";
        }
    </script>
</head>
<body>

    <div class="admin-layout">

        <aside class="admin-sidebar">
            <header>
                <a href="index.html" class="logo-admin">🥑 HuertoHogar Admin</a>
            </header>
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="productos.html" class="activo">Productos</a></li>
                    <li><a href="usuario.html">Usuarios</a></li>
                </ul>
            </nav>
            <button type="button" class="btn-logout-admin" onclick="cerrarSesionAdmin()">Cerrar sesión</button>
        </aside>

        <main class="admin-main">

            <div class="admin-header">
                <div>
                    <h1>Productos</h1>
                    <p>Administración del catálogo de productos de HuertoHogar</p>
                </div>

                <a href="nuevo-producto.html" class="btn-admin">+ Nuevo Producto</a>
            </div>

            <section>
                <table class="tabla-admin" id="tablaProductos">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Las filas se generan automáticamente aquí mediante JavaScript -->
                    </tbody>
                </table>
            </section>
        </main>

    </div>

    <footer class="admin-footer">
        <p>© 2026 HuertoHogar Admin. Panel de gestión interno 🌿</p>
    </footer>

    <script src="../js/productos.js"></script>
    <script src="../js/admin-productos.js"></script>
    <script src="../js/admin-auth.js"></script>
</body>
</html>
