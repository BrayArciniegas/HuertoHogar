<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto - Admin HuertoHogar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

    <div class="admin-layout">

        <aside class="admin-sidebar">
            <a href="index.html" class="logo-admin">🥑 HuertoHogar Admin</a>
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="productos.html" class="activo">Productos</a></li>
                    <li><a href="usuarios.html">Usuarios</a></li>
                </ul>
            </nav>
        </aside>

        <main class="admin-main">
            <h1>Editar Producto</h1>

            <form id="formProducto" class="form-admin">

                <label for="codigo">Código producto:</label>
                <input type="text" id="codigo" name="codigo" value="FR001">
                <small>Mínimo 3 caracteres, sin límite máximo</small>

                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" maxlength="100" value="Manzanas Fuji">

                <label for="descripcion">Descripción (opcional):</label>
                <textarea id="descripcion" name="descripcion" maxlength="500">Manzanas Fuji crujientes y dulces, cultivadas en el Valle del Maule.</textarea>

                <div class="fila-doble">
                    <div>
                        <label for="precio">Precio:</label>
                        <input type="number" id="precio" name="precio" min="0" step="0.01" value="1200">
                        <small>Puede ser 0 (producto FREE) o decimales</small>
                    </div>
                    <div>
                        <label for="stock">Stock:</label>
                        <input type="number" id="stock" name="stock" min="0" step="1" value="150">
                        <small>Solo números enteros</small>
                    </div>
                </div>

                <label for="stockCritico">Stock Crítico (opcional):</label>
                <input type="number" id="stockCritico" name="stockCritico" min="0" step="1" value="20">
                <small>Alerta cuando el stock llegue a este nivel o menos</small>

                <label for="categoria">Categoría:</label>
                <select id="categoria" name="categoria">
                    <option value="frutas" selected>Frutas Frescas</option>
                    <option value="verduras">Verduras Orgánicas</option>
                    <option value="organicos">Productos Orgánicos</option>
                    <option value="lacteos">Productos Lácteos</option>
                </select>

                <label for="imagen">Imagen (opcional):</label>
                <input type="file" id="imagen" name="imagen" accept="image/*">
                <small>Imagen actual: manzanas.jpg</small>

                <button type="submit">Guardar Cambios</button>
            </form>
        </main>

    </div>

</body>
</html>
