<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrador - HuertoHogar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
</head>
<body>

    <header>
        <span class="logo">🥑 HuertoHogar Admin</span>
    </header>

    <main>
        <section class="login-contenedor">
            <div class="encabezado-login">
                <span class="icono-login">🔐</span>
                <h1>Acceso Administrador</h1>
                <p>Ingresa tus credenciales para entrar al panel de gestión de HuertoHogar.</p>
            </div>
            <form id="formAdminLogin">
                <div class="campo">
                    <label for="emailAdmin">Correo electrónico:</label>
                    <input type="email" id="emailAdmin" name="emailAdmin" placeholder="usuario@duoc.cl" required>
                </div>

                <div class="campo">
                    <label for="passwordAdmin">Contraseña:</label>
                    <input type="password" id="passwordAdmin" name="passwordAdmin" placeholder="Ingresa tu contraseña" required>
                </div>

                <p id="mensajeErrorAdmin"></p>

                <button type="submit" class="btn-login">Ingresar</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="footer-inferior">
            <p>© 2026 HuertoHogar Admin. Panel de gestión interno 🌿</p>
        </div>
    </footer>

    <script src="../js/admin-auth.js"></script>
</body>
</html>
