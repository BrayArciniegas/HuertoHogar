<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Usuarios - HuertoHogar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/admin.css">

    <script>
        if (sessionStorage.getItem("adminAutenticado") !== "true") {
            window.location.href = "login.html";
        }
    </script>
</head>

<body>

<div class="admin-layout">

    <!-- MENÚ LATERAL -->
    <aside class="admin-sidebar">

        <header>
            <a href="index.html" class="logo-admin">
                🥑 HuertoHogar Admin
            </a>
        </header>

        <nav>
            <ul>
                <li>
                    <a href="index.html">Inicio</a>
                </li>

                <li>
                    <a href="productos.html">Productos</a>
                </li>

                <li>
                    <a href="usuario.html" class="activo">Usuarios</a>
                </li>
            </ul>
        </nav>

        <button type="button" class="btn-logout-admin" onclick="cerrarSesionAdmin()">
            Cerrar sesión
        </button>

    </aside>


    <!-- CONTENIDO PRINCIPAL -->
    <main class="admin-main">

        <div class="admin-header">

            <div>
                <h1>Usuarios</h1>
                <p>Administración de usuarios de HuertoHogar</p>
            </div>

            <a href="nuevo-usuario.html" class="btn-admin">
                + Nuevo Usuario
            </a>

        </div>


        <!-- TABLA DE USUARIOS -->
        <section class="tabla-contenedor">

            <table class="tabla-admin">

                <thead>
                    <tr>
                        <th>RUN</th>
                        <th>Nombre</th>
                        <th>Apellidos</th>
                        <th>Correo</th>
                        <th>Tipo de usuario</th>
                        <th>Región</th>
                        <th>Comuna</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody id="tablaUsuarios">

                    <!-- Los usuarios serán cargados mediante JavaScript -->

                </tbody>

            </table>

            <p id="mensajeUsuarios"></p>

        </section>

    </main>

</div>

<footer class="admin-footer">
    <p>© 2026 HuertoHogar Admin. Panel de gestión interno 🌿</p>
</footer>

<script src="../js/admin-auth.js"></script>
<script src="../js/admin-usuario.js"></script>

</body>
</html>
