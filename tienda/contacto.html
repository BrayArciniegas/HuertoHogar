<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googpleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">🥑HuertoHogar</a>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li></lo>
                <li><a href="carrito.html">Carrito</a></li>
            </ul>
        </nav>

        <div class="acciones-header">
            <a href="login.html">Iniciar seción</a>
            <a href="registro.html">Registrate</a>
            <a href="carrito.html">Carrito</a>
        </div>
    </header>
    
    <main>
        <section class="contacto-contenedor">
            <div class="encabezado-contacto">
                <span class="icono-contacto">🌱</span>
                <h1>¡Estamos para ayudarte!</h1>
                <p>Escríbenos y nos pondremos en contacto contigo lo antes posible</p>
            </div>
            <form id="formContacto">
                <div class="campo">
                    <label for="nombreContacto">Nombre completo:</label>
                    <input type="text"
                    id="nombreContacto"
                    name="nombreContacto"
                    placeholder="Ingresa tu nombre" required>
                </div>

                <div class="campo">
                    <label for="emailContacto">Correo electronico:</label>
                    <input type="email"
                    id="emailContacto"
                    name="emailContacto"
                    placeholder="ejemplo@correo.com" required>
                </div>

                <div class="campo">
                    <label for="asunto">Asunto:</label>
                    <input type="text"
                    id="asunto"
                    name="asunto"
                    placeholder="¿En que podemos ayudarte?" required>
                </div>

                <div class="campo">
                    <label for="mensaje">Mensaje</label>
                    <textarea
                    id="mensaje"
                    name="mensaje"
                    placeholder="Escribe tu mensaje aquí..." required></textarea>
                </div>

                <p id="mensajeErrorContacto"></p>
                <p id="mensajeExitoContacto"></p>

                <button type="submit" class="btn-contacto">Enviar mensaje</button>
            </form>
        </section>
    </main>

    <script src="../js/validaciones.js"></script>
</body>
</html>
